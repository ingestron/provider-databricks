apiVersion: ingestron.flow/v1
kind: ingestion
id: web
ingestion:
  standard: append-only@v1
  pipeline: web
  target:
    schema: web_current
  source:
    delivery: immutable-files
    deletes: not-applicable
  retention:
    sourceDeliveries: externally-retained
    period: P90D
defaults:
  source:
    binding: landed
    format: parquet
    path: /Volumes/{{values.catalog}}/landing/web/{{table.id}}
tables:
  customers:
    contract:
      $resolve: ./customers/contract.yaml
