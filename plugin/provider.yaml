quality:
  library: {}
  standards:
    snapshot-with-history@v1:
      library:
        nullValues: at-load
        missingValues: at-load
        invalidValues: at-load
        duplicateValues: at-load
        rowCount: at-load
      sql: at-load
      engines:
        databricks: at-load
    change-feed-with-history@v1:
      library:
        nullValues: at-load
        missingValues: at-load
        invalidValues: at-load
      engines:
        databricks: at-load
    append-only@v1:
      library:
        nullValues: at-load
        missingValues: at-load
        invalidValues: at-load
      engines:
        databricks: at-load
planner:
  apiVersion: ingestron.provider-planning/v1
  module: ./index.mjs
standards:
  - id: snapshot-with-history@v1
    description: Complete versioned snapshots to native history and current view
  - id: change-feed-with-history@v1
    description: Baseline and full-row change events to history and current view
  - id: append-only@v1
    description: Immutable files to a streaming table
  - id: query-ingestion@v1
    description: Database tables through a Lakeflow Connect query-based connector
  - id: sharepoint-ingestion@v1
    description: SharePoint files and lists through the Lakeflow Connect managed connector
  - id: saas-ingestion@v1
    description: Salesforce, HubSpot and Jira tables through Lakeflow Connect
      managed connectors
  - id: snapshot-publication@v1
    description: Verify immutable Parquet snapshots and conditionally publish an
      ordered delivery index
    sourceKinds:
      - adls
commands:
  apiVersion: ingestron.provider-commands/v1
  execution: offline-json
  module: ./commands.mjs
  definitions:
    - name: discover route
      description:
        Generate a read-only metadata query through a Lakehouse Federation
        foreign catalog for a native database connection flow; no workspace
        calls.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - flow
          - kind
          - source
          - tables
          - binding
        properties:
          flow:
            type: string
            minLength: 1
            maxLength: 100
          kind:
            type: string
            minLength: 1
            maxLength: 50
          source:
            type: object
          tables:
            type: object
          target:
            type: object
          binding:
            type: object
          connectionBinding:
            type: object
    - name: discover import
      description:
        Review supplied table metadata as contract proposals; no source
        connection or file changes.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - tables
        properties:
          tables:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required:
                - name
                - columns
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                columns:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - name
                      - type
                      - nullable
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 128
                      type:
                        type: string
                        minLength: 1
                        maxLength: 64
                      nullable:
                        type: boolean
    - name: deploy inspect
      description:
        Inspect supplied native deployment assets; no live validation,
        target diff or deployment.
      inputSchema:
        type: object
        additionalProperties: false
        required:
          - artifact
        properties:
          artifact:
            type: object
    - name: connection prepare
      description:
        Prepare a driver-side connector job using locked source assets; no
        workspace calls.
      inputSchema:
        type: object
        additionalProperties: true
    - name: connector contracts
      description: Export reviewed ODCS contracts
      inputSchema:
        type: object
        properties:
          review:
            type: object
        required:
          - review
        additionalProperties: false
    - name: project assemble
      description: Assemble one scoped platform project without deployment
      inputSchema:
        type: object
        additionalProperties: true
lifecycle:
  apiVersion: ingestron.provider-lifecycle/v1
  module: ./lifecycle.mjs
outputSchemas:
  bundle: ./schemas/databricks-bundle.json
capabilities:
  artifactKinds:
    - native-notebook
    - file-project
  delivery: true
  handovers:
    - files
    - relation
  packContracts:
    snapshot-presets:
      version: 1.0.0
      activities:
        - snapshot-publish
        - lakeflow-ingest
connectorRuntimes:
  ingestron.snapshot/python/v1:
    selectionSchema:
      type: object
      additionalProperties:
        type: object
        properties:
          name:
            type: string
            minLength: 1
          fields:
            type: object
            additionalProperties:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - integer
                    - string
                    - boolean
                    - number
                    - decimal
                    - json
                nullable:
                  type: boolean
                precision:
                  type: integer
                scale:
                  type: integer
              required:
                - type
                - nullable
              additionalProperties: false
        required:
          - name
          - fields
        additionalProperties: false
    executionSchema:
      type: object
      properties:
        mode:
          enum:
            - databricks
          type: string
        existingClusterId:
          type: string
          minLength: 1
        bundleDirectory:
          type: string
          minLength: 1
        notebookPath:
          type: string
          minLength: 1
        pythonExecutable:
          type: string
          minLength: 1
        azure:
          type: object
          properties:
            storageAccount:
              type: string
              minLength: 1
            container:
              type: string
              minLength: 1
            prefix:
              type: string
              minLength: 1
            tenantId:
              type: string
              minLength: 1
            clientId:
              type: string
              minLength: 1
            clientSecretEnv:
              type: string
              minLength: 1
          required:
            - storageAccount
            - container
            - prefix
            - tenantId
            - clientId
            - clientSecretEnv
          additionalProperties: false
        secrets:
          type: object
          additionalProperties:
            type: object
            properties:
              scope:
                type: string
                minLength: 1
              key:
                type: string
                minLength: 1
            required:
              - scope
              - key
            additionalProperties: false
      required:
        - mode
        - existingClusterId
        - bundleDirectory
        - notebookPath
        - pythonExecutable
        - azure
        - secrets
      additionalProperties: false
    executionPlatforms:
      - databricks
    prepareCommand: connection prepare
    contractsCommand: connector contracts
projectAssembly:
  apiVersion: ingestron.project-assembly/v1
  command: project assemble
