apiVersion: ingestron.provider/v1
id: databricks-native
version: 3.7.0
platform: databricks
renderer:
  apiVersion: ingestron.provider-generation/v1
  module: ./index.mjs
configurationSchema: ./configuration.schema.json
activities:
  snapshot-publish-input: ./activities/snapshot-publish-input/activity.yaml
  lakeflow-ingest-input: ./activities/lakeflow-ingest-input/activity.yaml
  snapshot-publish: ./activities/snapshot-publish/activity.yaml
  lakeflow-ingest: ./activities/lakeflow-ingest/activity.yaml
  materialized-view: ./activities/materialized-view/activity.yaml
compatibility:
  plan: ingestron.plan/v1
  minimumCli: 4.2.0
  requiredFeatures:
    - native-project
    - delivery-exports
    - export-groups
    - model-inputs
    - extension-packs
    - ingestion-presets
    - relation-handovers
    - project-connections
    - odcs-connections
    - connector-runtime-assets
    - connector-runtime-capabilities
    - project-assembly
    - quality-capabilities
    - source-coverage
sources:
  azure-blob:
    route: native
    standards:
      - append-only@v1
      - snapshot-with-history@v1
      - change-feed-with-history@v1
    capabilities:
      - snapshot
      - incremental
    reference:
      docs: https://learn.microsoft.com/azure/databricks/ingestion/cloud-object-storage/auto-loader/
      vendorStatus: ga
      licence: Databricks platform terms; generated files Apache-2.0
      cost:
        model: included
        pricing: https://www.databricks.com/product/pricing/lakeflow-declarative-pipelines
        note: Runs as Lakeflow pipeline compute in your workspace
      access:
        model: subscription
        url: https://learn.microsoft.com/azure/databricks/
        note: A Unity Catalog workspace
      auth:
        - unity-catalog
      network:
        - public
        - private-network
      maturity: preview
      verified: 2026-09-30
      note: JSON and Parquet files in ADLS or Volumes through Auto Loader
    bindingSchema:
      type: object
      required:
        - kind
      properties:
        kind:
          enum:
            - adls
            - files
        root:
          type: string
          minLength: 6
          maxLength: 1000
    source:
      binding: "{{connection.binding}}"
  s3:
